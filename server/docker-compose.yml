# ShareToFriends – Server für einen kleinen VPS (1 vCPU / 1 GB RAM reichen).
#
#   ./setup.sh meinname.example.com      erzeugt Geheimnisse (.env), coturn-Konfiguration und startet alles
#
# Der Server vermittelt den Verbindungsaufbau (Signaling), ist TURN-Fallback und liefert die App-Updates aus.
# Zu Hause werden KEINE Ports geöffnet; die Streams laufen direkt von PC zu PC.

services:
  signaling:
    build: .
    container_name: stf-signaling
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=8787
      - TURN_HOST=${DOMAIN:?./setup.sh <domain> ausführen}
      - TURN_SECRET=${TURN_SECRET:?./setup.sh <domain> ausführen}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  coturn:
    image: coturn/coturn:latest
    container_name: stf-coturn
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    container_name: stf-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./updates:/srv/updates:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Update mirror: copies the newest release (built by GitHub Actions) into ./updates, verified by its SHA-512.
  # The apps download their updates from https://<domain>/updates and never talk to GitHub.
  updates-sync:
    image: node:22-alpine
    container_name: stf-updates-sync
    restart: unless-stopped
    working_dir: /app
    command: ["node", "update-sync.js"]
    environment:
      - UPDATES_DIR=/srv/updates
      - GITHUB_REPO=${GITHUB_REPO:-S7VENZZ/ShareToFriends}
      - INTERVAL_MIN=${SYNC_INTERVAL_MIN:-5}
      - KEEP_VERSIONS=2
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./update-sync.js:/app/update-sync.js:ro
      - ./updates:/srv/updates
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [all]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
