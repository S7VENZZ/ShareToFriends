name: Release

# Pushing a tag like v2.0.2 builds the Windows installer and publishes it as a GitHub release.
# Installed apps look at "releases/latest" and update themselves in the background.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tag must match package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build:helper

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/ShareToFriends-Setup-*.exe
            app/dist/ShareToFriends-Setup-*.exe.blockmap
            app/dist/latest.yml
          generate_release_notes: true
